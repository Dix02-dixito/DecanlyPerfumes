<!doctype html>
<html lang="es-PE" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Mi cuenta')}">
    <title>Mi cuenta · Decanly</title>
  </head>
  <body data-route="cuenta" data-page="cuenta/index">
    <div th:replace="~{fragments/layout :: cabecera}"></div>
    <div
      id="connection-status"
      class="connection-status"
      role="status"
      hidden
    ></div>
    <main id="app" tabindex="-1">
      <section class="page-head">
        <div class="eyebrow">Decanly</div>
        <h1>Tu espacio <em>de gestión.</em></h1>
      </section>
      <section class="panel account">
        <h2>Bienvenido de nuevo</h2>
        <div th:if="${datosTienda.user == null}">
          <p class="notice">Ingresa con tu cuenta de administrador.</p>
          <form id="login" th:action="@{/api/sesion}" method="post">
            <label for="email">Correo</label
            ><input
              class="field"
              name="email"
              id="email"
              type="email"
              maxlength="120"
              autocomplete="username"
              required
            /><label for="password">Contraseña</label
            ><input
              class="field"
              name="password"
              id="password"
              type="password"
              autocomplete="current-password"
              required
            /><button class="btn" type="submit">Entrar al panel ↗</button>
            <p class="form-feedback" role="status" aria-live="polite"></p>
          </form>
        </div>
        <div th:if="${datosTienda.user != null}">
          <p
            class="notice"
            th:text="'Sesión iniciada: ' + ${datosTienda.user.email}"
          ></p>
          <a
            class="btn"
            th:if="${datosTienda.user.role == 'ADMIN'}"
            th:href="@{/producto}"
            >Ir al panel</a
          >
          <p th:unless="${datosTienda.user.role == 'ADMIN'}">
            Tu cuenta no tiene permiso de administración.
          </p>
          <button class="text-link" type="button" data-action="logout">
            Cerrar sesión
          </button>
        </div>
      </section>
    </main>
    <div th:replace="~{fragments/layout :: pie}"></div>
  </body>
</html>
