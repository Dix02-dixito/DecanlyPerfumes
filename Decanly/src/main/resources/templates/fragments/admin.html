<!doctype html>
<html lang="es-PE" xmlns:th="http://www.thymeleaf.org">
  <body>
    <aside th:fragment="sidebar" class="admin-sidebar">
      <span class="admin-label">DECANLY STUDIO</span>
      <p>Tu colección,<br />bajo control.</p>
      <nav aria-label="Secciones de administración">
        <a th:href="@{/producto}"
          ><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />

        ><a th:href="@{/promocion}"

        ><a th:href="@{/pedidos}"

            <path d="M6 4h12v17H6zM9 2h6v4H9zM9 10h6M9 14h6" /></svg

      <a th:href="@{/usuarios}">Usuarios</a></nav>
      <a th:href="@{/}">Ver tienda ↗</a>

</html>
