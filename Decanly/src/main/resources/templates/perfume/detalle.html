<!doctype html>
<html lang="es-PE" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle de perfume')}"><title>Detalle de perfume</title></head>
<body>
  <div th:replace="~{fragments/layout :: cabecera}"></div>
  <main id="app" tabindex="-1">
    <section class="section detail-page">
      <a class="text-link" th:href="@{/catalogo}">← Volver al catálogo</a>
      <div id="standalone-detail">
        <div class="detail">
          <div class="detail-gallery">
            <div class="detail-thumbnails" aria-label="Fotografías del perfume">
              <button type="button" class="selected" aria-pressed="true" th:attr="data-photo=@{/imagenes/{id}(id=${p.imagen.id})},aria-label='Ver foto principal de '+${p.nombre}">
                <img th:src="@{/imagenes/{id}(id=${p.imagen.id})}" alt="Foto principal" />
              </button>
              <button type="button" th:each="foto : ${galeria}" th:if="${foto.imagenId != p.imagen.id}" aria-pressed="false"
                th:attr="data-photo=@{/imagenes/{id}(id=${foto.imagenId})},aria-label=${foto.descripcion ?: 'Ver otra fotografía'}">
                <img th:src="@{/imagenes/{id}(id=${foto.imagenId})}" th:alt="${foto.descripcion ?: p.nombre}" />
              </button>
            </div>
            <div class="detail-carousel">
              <div class="detail-art"><img id="perfume-photo" th:src="@{/imagenes/{id}(id=${p.imagen.id})}" th:alt="${p.nombre}" /></div>
              <span class="detail-photo-label" th:text="'Frasco original de ' + ${p.nombre}"></span>
            </div>
          </div>
          <div class="detail-copy">
            <span class="brand" th:text="${p.marca.nombre}"></span>
            <h1 th:text="${p.nombre}"></h1><span class="detail-rule"></span>
            <p class="detail-notes" th:if="${!#strings.isEmpty(p.notas)}" th:text="${p.notas}"></p>
            <form th:action="@{/carrito/agregar}" method="post">
              <input type="hidden" name="productoId" th:value="${p.id}" />
              <fieldset class="perfume-size-fieldset">
                <legend class="size-label">SELECCIONA TU TAMAÑO</legend>
                <div class="detail-sizes native-detail-sizes">
                  <label th:each="v,estado : ${p.presentaciones}">
                    <input type="radio" name="ml" th:value="${v.ml}" th:checked="${estado.first}" required />
                    <b th:text="${v.ml}+' ml'"></b>
                    <strong th:text="'S/ '+${#numbers.formatDecimal(v.precioFinal,1,2,'POINT')}"></strong>
                    <small th:text="${v.stock == 0} ? 'Agotado' : (${v.ml == 3} ? 'Para probar' : (${v.ml == 5} ? 'Para descubrir' : 'Tu favorito diario'))"></small>
                  </label>
                </div>
              </fieldset>
              <label class="perfume-quantity">Cantidad <input class="field" type="number" name="cantidad" value="1" min="1" max="99" required /></label>
              <div class="detail-actions">
                <button class="btn outline" name="destino" value="carrito" th:disabled="${!p.conStock}"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14l1 14H4L5 7zM9 8V5a3 3 0 0 1 6 0v3"/></svg>Agregar al carrito</button>
                <button class="btn" name="destino" value="comprar" th:disabled="${!p.conStock}">Comprar ahora <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
              </div>
            </form>
            <ul class="detail-perks"><li>✓ Perfumes originales en decants</li><li>✓ Envíos a todo el Perú</li><li>✓ Coordina tu entrega por WhatsApp</li></ul>
            <div class="detail-trust">
              <span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6l8-3Zm-4 9 3 3 5-6"/></svg>Perfume<br>original</span>
              <span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9h10v12H7zM9 9V3h6v6M9 6h6"/></svg>Atomizador<br>de vidrio</span>
              <span><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5h12v13H2zM14 10h4l4 5v3h-8"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/></svg>Entrega<br>coordinada</span>
            </div>
            <p class="hint">Recibirás un decant del tamaño seleccionado. El frasco original de la foto no está incluido.</p>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div th:replace="~{fragments/layout :: pie}"></div>
  <script th:src="@{/js/perfume.js}" defer></script>
</body>
</html>
