<!doctype html>
<html lang="es-PE" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedidos')}">
    <title>Pedidos</title>
</head>
<body>
    <!-- Cabecera -->
    <div th:replace="~{fragments/layout :: cabecera}"></div>

    <!-- Contenido Principal -->
    <main id="app" tabindex="-1">
        <section class="admin-shell">
            <!-- Menú lateral de administración -->
            <aside th:replace="~{fragments/admin :: sidebar}"></aside>

            <div class="admin-main">
                <!-- Encabezado de la sección -->
                <div class="admin-heading">
                    <div>
                        <span class="eyebrow">Ventas y entregas</span>
                        <h1>Pedidos.</h1>
                    </div>
                </div>

                <!-- Barra de búsqueda y filtros -->
                <form class="admin-toolbar" th:action="@{/pedidos}" method="get">
                    <input class="field" name="q" placeholder="Referencia o cliente" />
                    
                    <select class="field" name="estado">
                        <option value="">Todos los estados</option>
                        <option>PENDIENTE</option>
                        <option>CONFIRMADO</option>
                        <option>ENTREGADO</option>
                        <option>CANCELADO</option>
                    </select>
                    
                    <button class="btn">Consultar</button>
                </form>

                <!-- Tabla de resultados -->
                <div class="table-wrap">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Referencia</th>
                                <th>Cliente</th>
                                <th>Estado</th>
                                <th>Total</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
						<tbody>

						<tr th:each="p : ${pedidos}">

						    <td th:text="${p.id}">
						    </td>

						    <td th:text="${p.nombreCliente}">
						    </td>

						    <td th:text="${p.estadoPedido}">
						    </td>

						    <td th:text="${p.totalPedido}">
						    </td>

						    <td>

						        <form th:action="@{/pedido/{id}/cancelar(id=${p.id})}"
						              method="post">

						            <button class="btn light"
						                    type="submit">

						                Cancelar

						            </button>

						        </form>

						    </td>

						</tr>

						<tr th:if="${#lists.isEmpty(pedidos)}">

						    <td colspan="5">
						        No hay pedidos registrados.
						    </td>

						</tr>

						</tbody>
                    </table>
                </div>

            </div>
        </section>
    </main>

    <!-- Pie de página -->
    <div th:replace="~{fragments/layout :: pie}"></div>
</body>
</html>
