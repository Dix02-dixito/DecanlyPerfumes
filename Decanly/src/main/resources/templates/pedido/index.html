<!doctype html>
<html lang="es-PE" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedidos')}"><title>Pedidos</title></head>
<body>
<div th:replace="~{fragments/layout :: cabecera}"></div>
<main id="app" class="orders-page" tabindex="-1">
    <section class="admin-shell">
        <aside th:replace="~{fragments/admin :: sidebar}"></aside>
        <div class="admin-main">
            <div class="admin-heading">
                <div><span class="eyebrow">Registro de ventas</span><h1>Pedidos.</h1></div>
                <a class="btn" th:href="@{/pedidos/nuevo}">Nuevo pedido</a>
            </div>
            <p class="notice" role="status" th:if="${exito != null}" th:text="${exito}"></p>
            <form class="admin-toolbar" th:action="@{/pedidos}" method="get">
                <input class="field" type="number" name="id" min="1" step="1" th:value="${idBuscado}"
                       placeholder="ID del pedido" aria-label="ID del pedido" />
                <input class="field" type="search" name="q" th:value="${q}" placeholder="Nombre del cliente" aria-label="Nombre del cliente" />
                <button class="btn" type="submit">Buscar</button>
                <a class="text-link" th:href="@{/pedidos}">Limpiar filtros</a>
            </form>
            <div class="table-wrap">
                <table class="admin-table orders-list">
                    <thead><tr><th>ID del pedido</th><th>Nombre del cliente</th><th>Perfumes comprados</th><th>Total del pedido</th></tr></thead>
                    <tbody>
                    <tr th:each="p : ${pedidos}">
                        <td data-label="ID del pedido"><a class="text-link" th:href="@{/pedidos/{id}(id=${p.id})}" th:attr="aria-label=|Ver detalle del pedido #${p.id}|"><strong th:text="|#${p.id}|"></strong><span class="order-detail-link">Ver detalle</span></a></td>
                        <td data-label="Nombre del cliente"><span th:text="${p.nombreCliente}"></span><small class="order-legacy" th:unless="${p.registroManual}">Registro anterior</small></td>
                        <td data-label="Perfumes comprados" th:text="${p.perfumesComprados}"></td>
                        <td data-label="Total del pedido" th:text="|S/ ${#numbers.formatDecimal(p.totalPedido, 1, 2, 'POINT')}|"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pedidos)}"><td colspan="4">No hay pedidos registrados para esta búsqueda.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
<div th:replace="~{fragments/layout :: pie}"></div>
</body>
</html>
