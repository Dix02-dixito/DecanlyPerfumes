spring.application.name=Decanly
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
server.port=${PORT:8091}
spring.thymeleaf.cache=false
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/decanly}
spring.datasource.username=${DB_USER:decanly}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=16MB
server.error.include-message=never
decanly.whatsapp.numero=${WHATSAPP_NUMBER:51907032488}
# Desactivado salvo en el primer arranque de una base nueva.
decanly.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN:false}
